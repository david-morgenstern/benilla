[package]
name = "benilla-crawl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Darkened Deeps: a turn-based, stress-driven dungeon crawler built on benilla's WoW 1.12.1 asset stack"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-blp = { path = "../benilla-blp" }
bevy.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "benilla-crawl"
path = "src/main.rs"
