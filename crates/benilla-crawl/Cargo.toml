[package]
name = "benilla-crawl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Darkened Deeps: a turn-based, stress-driven dungeon crawler built on benilla's WoW 1.12.1 asset stack"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-blp = { path = "../benilla-blp" }
bevy.workspace = true
# Output for the kira mixer, at benilla-app's version so the graph has one cpal.
cpal = "0.17"
# The mixer, at benilla-app's version and decoders; its own cpal backend stays off.
kira = { version = "0.12", default-features = false, features = ["mp3", "wav", "pcm", "adpcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "benilla-crawl"
path = "src/main.rs"
